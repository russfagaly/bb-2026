<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>2026 Alameda LL Majors</title>
<style>
:root {
  --navy:#002B5C; --navy2:#1a3a6b; --bg:#f0f4f8; --card:#fff;
  --border:#e2e8f0; --text:#111827; --muted:#6b7280;
  --accent:#38bdf8; --gold:#f59e0b;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center}
#root{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* Header */
.hdr{background:linear-gradient(160deg,#002B5C,#1a4a8a);padding:10px 14px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.3);z-index:10}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between}
.hdr-title{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hdr-sub{color:#93c5fd;font-size:10px;margin-top:1px}
.hdr-date{text-align:right}
.hdr-date-lbl{font-size:9px;color:#93c5fd}
.hdr-date-val{font-size:12px;font-weight:700;color:#fff}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}

/* Bottom nav */
.bnav{display:flex;background:#fff;border-top:1px solid var(--border);padding-bottom:var(--safe-b);flex-shrink:0;box-shadow:0 -2px 8px rgba(0,0,0,.07)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 0;border:none;background:none;cursor:pointer;gap:2px}
.bnav-icon{font-size:19px;line-height:1}
.bnav-lbl{font-size:8px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.bnav-item.on .bnav-lbl{color:var(--navy)}

/* Segment */
.seg{display:flex;background:#dde3ec;border-radius:10px;padding:2px;margin:10px 14px}
.seg-btn{flex:1;padding:6px;border:none;background:none;font-size:12px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
.seg-btn.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* Chips */
.chips{overflow-x:auto;scrollbar-width:none;padding:0 14px 10px;display:flex;gap:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Sec header */
.sec-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.sec-bar{width:3px;height:16px;border-radius:2px;flex-shrink:0}
.sec-ttl{font-size:13px;font-weight:800;color:var(--text)}
.sec-right{margin-left:auto;font-size:11px;color:var(--accent);font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit}

/* Leader list */
.lb-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);margin:0 14px 14px}
.lb-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f1f5f9}
.lb-item:last-child{border-bottom:none}
.lb-rank{font-size:12px;font-weight:800;color:#cbd5e1;width:18px;text-align:center;flex-shrink:0}
.lb-rank.g{color:var(--gold)}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-team{font-size:10px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:4px}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:5px}
.lb-bar-wrap{width:48px;height:5px;background:#e2e8f0;border-radius:3px;flex-shrink:0}
.lb-bar{height:100%;border-radius:3px}
.lb-val{font-size:14px;font-weight:800;min-width:44px;max-width:70px;text-align:right;flex-shrink:0;white-space:nowrap}

/* Team grid */
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.tc{border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
.tc:active{opacity:.85}
.tc-hdr{padding:10px 12px 8px}
.tc-name{font-size:14px;font-weight:800;color:#fff}
.tc-games{font-size:9px;color:rgba(255,255,255,.7);margin-top:1px}
.tc-body{padding:8px 10px;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ts{text-align:center;padding:4px 0}
.ts-val{font-size:12px;font-weight:800;color:var(--text)}
.ts-lbl{font-size:7px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* Table */
.tbl-outer{margin:0 14px;overflow-x:auto}
.tbl-outer::-webkit-scrollbar{height:3px}
.tbl-outer::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.tbl-wrap{border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.stbl{width:100%;min-width:600px;border-collapse:collapse;font-size:11px}
.stbl thead tr{background:var(--navy)}
.stbl.green thead tr{background:#0d6c2e}
.stbl th{color:#fff;padding:8px 8px 8px 4px;font-weight:700;font-size:10px;letter-spacing:.3px;cursor:pointer;user-select:none;white-space:nowrap;text-align:center}
.stbl th:first-child{text-align:left;padding-left:10px;min-width:110px;position:sticky;left:0;background:var(--navy);z-index:3}
.stbl.green th:first-child{background:#0d6c2e}
.stbl th.srt{background:#1a4a8a}
.stbl.green th.srt{background:#155e32}
.srt-arr{font-size:8px;opacity:.8;margin-left:2px}
.stbl td{padding:6px 5px;text-align:center;border-bottom:1px solid #f1f5f9}
.stbl td:first-child{text-align:left;padding-left:10px;font-weight:600;position:sticky;left:0;background:#fff;z-index:2}
.stbl tbody tr:nth-child(even) td:first-child{background:#f8fafc}
.stbl tbody tr:nth-child(even){background:#f8fafc}
.stbl tbody tr:hover{background:#e0f2fe!important;cursor:pointer}
.stbl tbody tr:hover td:first-child{background:#e0f2fe!important}
.stbl.green tbody tr:hover{background:#dcfce7!important}
.stbl.green tbody tr:hover td:first-child{background:#dcfce7!important}
.stbl td.hi{font-weight:800;color:var(--navy)}
.stbl.green td.hi{color:#166534}

/* Search/filter */
.filter-row{display:flex;gap:8px;padding:0 14px 10px}
.srch{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:7px 12px;font-size:13px;outline:none;font-family:inherit}
.srch:focus{border-color:var(--accent)}
.tsel{border:1.5px solid var(--border);border-radius:20px;padding:7px 8px;font-size:11px;outline:none;background:#fff;font-family:inherit;color:var(--text)}

/* Schedule */
.sday-hdr{padding:5px 14px;background:#e4eaf2;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.sgame{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);background:#fff;gap:6px}
.sgame-teams{flex:1;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sgame-cnt{font-size:9px;color:var(--muted)}

/* Sheet modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fIn .2s}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:92dvh;overflow-y:auto;animation:sUp .22s ease}
@keyframes sUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-hdr{padding:10px 12px;position:sticky;top:0;z-index:5;color:#fff;display:flex;align-items:center;justify-content:space-between}
.sheet-close{width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet-body{padding:10px 14px 32px}

/* Pills */
.pills-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pill{background:#fff;border-radius:8px;padding:6px 2px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07);min-width:0}
.pill-val{font-size:12px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-lbl{font-size:7px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.pill.hi .pill-val{color:var(--navy)}

/* Game log */
.glog-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px}
.glog-date{color:var(--muted);flex-shrink:0;width:42px;font-size:10px}
.glog-opp{flex-shrink:0;width:60px;font-weight:600}
.glog-ab{width:30px;text-align:center;font-weight:700}
.glog-note{flex:1;color:var(--muted);font-size:10px;text-align:right}

/* Reports */
.rpt-body{padding:14px;font-size:13px;line-height:1.75;color:var(--text)}
.rpt-body h1{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--navy)}
.rpt-body h2{font-size:14px;font-weight:700;margin:18px 0 6px;color:var(--navy);border-left:3px solid var(--gold);padding-left:8px}
.rpt-body h3{font-size:12px;font-weight:700;margin:12px 0 4px;color:#374151}
.rpt-body p{margin-bottom:8px}
.rpt-body ul{margin-left:16px;margin-bottom:8px}
.rpt-body li{margin-bottom:3px}
.rpt-body strong{font-weight:700}
.rpt-body em{font-style:italic;color:#4b5563}
.rpt-body hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.rpt-body code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:11px}

.loading{display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:var(--muted)}
.empty{padding:32px 14px;text-align:center;font-size:13px;color:var(--muted)}

/* Tweaks panel */
.twk{position:fixed;bottom:80px;right:12px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px;width:200px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:200;font-size:12px}
.twk-title{font-weight:800;font-size:13px;margin-bottom:12px;color:var(--navy)}
.twk-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.twk-lbl{font-size:11px;font-weight:600;color:var(--muted)}
.twk-sel{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;font-family:inherit;outline:none}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const TC = {
  Astros:     {p:'#002D62', a:'#EB6E1F'},
  Brewers:    {p:'#12284B', a:'#FFC52F'},
  Giants:     {p:'#27251F', a:'#FD5A1E'},
  Guardians:  {p:'#002B5C', a:'#E31937'},
  Marlins:    {p:'#00685E', a:'#0096D6'},
  Padres:     {p:'#2F241D', a:'#FFC425'},
  'White Sox':{p:'#27251F', a:'#C4CED4'},
  Yankees:    {p:'#003087', a:'#C4CED4'},
};

const teamColor = t => TC[t] || {p:'#374151', a:'#6b7280'};
const fmtDate = iso => {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
};

// Simple markdown renderer
function renderMd(md) {
  if (!md) return null;
  return md.split('\n').map((line, i) => {
    if (line.startsWith('# ')) return <h1 key={i}>{line.slice(2)}</h1>;
    if (line.startsWith('## ')) return <h2 key={i}>{line.slice(3)}</h2>;
    if (line.startsWith('### ')) return <h3 key={i}>{line.slice(4)}</h3>;
    if (line.startsWith('- ') || line.startsWith('* ')) return <li key={i} dangerouslySetInnerHTML={{__html:inlineMd(line.slice(2))}} />;
    if (line.startsWith('---')) return <hr key={i}/>;
    if (line.trim() === '') return <br key={i}/>;
    return <p key={i} dangerouslySetInnerHTML={{__html:inlineMd(line)}} />;
  });
}
function inlineMd(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

// ── LEADERS TAB ─────────────────────────────────────────────────────────────
function LeadersTab({lb}) {
  const [mode, setMode] = React.useState('hitting');
  const cats = lb ? lb[mode] : [];
  const [catIdx, setCatIdx] = React.useState(0);
  const cur = cats?.[catIdx];
  const entries = cur?.entries || [];
  const max = entries[0]?.raw || 1;
  const c = mode === 'hitting' ? teamColor('Yankees') : {p:'#0d6c2e',a:'#22c55e'};

  React.useEffect(() => setCatIdx(0), [mode]);

  return (
    <div>
      <div className="seg">
        <button className={`seg-btn${mode==='hitting'?' on':''}`} onClick={()=>setMode('hitting')}>⚾ Hitting</button>
        <button className={`seg-btn${mode==='pitching'?' on':''}`} onClick={()=>setMode('pitching')}>🥎 Pitching</button>
      </div>
      <div className="chips">
        {(cats||[]).map((cat,i) => (
          <div key={i} className={`chip${i===catIdx?' on':''}`} onClick={()=>setCatIdx(i)}>
            {cat.title.replace(/\(.*\)/,'').trim()}
          </div>
        ))}
      </div>
      {cur && (
        <>
          <div className="sec-hdr">
            <div className="sec-bar" style={{background:c.p}}/>
            <div className="sec-ttl">{cur.title}</div>
            <div style={{marginLeft:'auto',fontSize:10,color:'var(--muted)'}}>Top {entries.length}</div>
          </div>
          <div className="lb-card">
            {entries.map((e,i) => {
              const tc = teamColor(e.team);
              const pct = (e.raw / max) * 100;
              return (
                <div key={i} className="lb-item">
                  <div className={`lb-rank${i<3?' g':''}`}>{e.rank}</div>
                  <div className="lb-info">
                    <div className="lb-name">{e.name}</div>
                    <div className="lb-team">
                      <span className="tdot" style={{background:tc.a}}/>
                      {e.team}
                    </div>
                  </div>
                  <div className="lb-bar-wrap">
                    <div className="lb-bar" style={{width:`${pct}%`,background:c.p}}/>
                  </div>
                  <div className="lb-val" style={{color:i===0?'var(--gold)':c.p}}>{e.value}</div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ── TEAMS TAB ────────────────────────────────────────────────────────────────
function TeamsTab({teamStats, playerStats, results, standings}) {
  const [sel, setSel] = React.useState(null);
  const [view, setView] = React.useState('standings');

  const teams = Object.entries(teamStats||{}).map(([k,v])=>({key:k,...v}));

  const records = React.useMemo(() => {
    if (!results) return {};
    const out = {};
    results.forEach(g => {
      [g.t1,g.t2].forEach(t => {
        if (!out[t]) out[t]={w:0,l:0};
        if (g.winner===t) out[t].w++; else out[t].l++;
      });
    });
    return out;
  }, [results]);

  const fmtRec = (w,l) => `${w}-${l}`;

  return (
    <div>
      <div className="seg">
        <button className={`seg-btn${view==='standings'?' on':''}`} onClick={()=>setView('standings')}>🏅 Standings</button>
        <button className={`seg-btn${view==='teams'?' on':''}`} onClick={()=>setView('teams')}>🏟️ Teams</button>
      </div>

      {view==='standings' && standings && (
        <>
          <div className="sec-hdr">
            <div className="sec-bar" style={{background:'var(--navy)'}}/>
            <div className="sec-ttl">2026 Standings</div>
          </div>
          <div style={{margin:'0 14px',overflowX:'auto'}}>
            <div style={{borderRadius:12,overflow:'hidden',boxShadow:'0 1px 6px rgba(0,0,0,.08)',minWidth:600}}>
              <table className="stbl" style={{width:'100%',minWidth:'unset'}}>
                <thead>
                  <tr>
                    <th style={{textAlign:'left',paddingLeft:10,position:'sticky',left:0,background:'var(--navy)',zIndex:3,minWidth:110}}>Team</th>
                    <th>W</th><th>L</th><th>T</th><th>GB</th>
                    <th>RS</th><th>RA</th><th>DIFF</th>
                    <th>STK</th>
                    <th>HOME</th><th>AWAY</th>
                    <th>LJTHN</th><th>WOOD</th>
                  </tr>
                </thead>
                <tbody>
                  {standings.map((s,i)=>{
                    const tc=teamColor(s.team);
                    const diff=s.rs-s.ra;
                    const isW=s.streak?.endsWith('W');
                    return (
                      <tr key={s.team} onClick={()=>setSel(teams.find(t=>t.key===s.team))}>
                        <td style={{position:'sticky',left:0,background:i%2?'#f8fafc':'#fff',zIndex:2}}>
                          <span className="tdot" style={{background:tc.a}}/>
                          {s.team}
                        </td>
                        <td style={{fontWeight:800,color:'#166534'}}>{s.w}</td>
                        <td style={{color:'var(--muted)'}}>{s.l}</td>
                        <td style={{color:'var(--muted)'}}>{s.t}</td>
                        <td style={{color:'var(--muted)'}}>{s.gb}</td>
                        <td>{s.rs}</td>
                        <td>{s.ra}</td>
                        <td style={{fontWeight:700,color:diff>=0?'#166534':'#dc2626'}}>{diff>0?'+':''}{diff}</td>
                        <td style={{fontWeight:700,color:isW?'#166534':'#dc2626'}}>{s.streak}</td>
                        <td>{fmtRec(s.hw,s.hl)}</td>
                        <td>{fmtRec(s.aw,s.al)}</td>
                        <td>{fmtRec(s.ljw,s.ljl)}</td>
                        <td>{fmtRec(s.wdw,s.wdl)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{padding:'6px 14px 14px',fontSize:10,color:'var(--muted)'}}>
            HOME/AWAY = Littlejohn games with known home/away · LJTHN = all Littlejohn games · WOOD = weekday Wood games
          </div>
        </>
      )}

      {view==='teams' && (
      <>
      <div className="sec-hdr">
        <div className="sec-bar" style={{background:'var(--navy)'}}/>
        <div className="sec-ttl">All Teams</div>
      </div>
      <div className="team-grid">
        {teams.map(t => {
          const tc = teamColor(t.key);
          const h = t.hitting;
          return (
            <div key={t.key} className="tc" onClick={()=>setSel(t)}>
              <div className="tc-hdr" style={{background:tc.p}}>
                <div className="tc-name">{t.key}</div>
                <div className="tc-games">{records[t.key] ? `${records[t.key].w}W–${records[t.key].l}L · ` : ''}{t.games} games</div>
              </div>
              <div className="tc-body">
                <div style={{gridColumn:'1/-1',fontSize:8,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',paddingBottom:2,borderBottom:'1px solid var(--border)',marginBottom:2}}>Hitting</div>
                <div className="ts"><div className="ts-val">{h?.avg?.toFixed(3).replace(/^0/,'')}</div><div className="ts-lbl">AVG</div></div>
                <div className="ts"><div className="ts-val">{h?.ops?.toFixed(3).replace(/^0/,'')}</div><div className="ts-lbl">OPS</div></div>
                <div className="ts"><div className="ts-val">{h?.hr}</div><div className="ts-lbl">HR</div></div>
                <div className="ts"><div className="ts-val">{h?.rbi}</div><div className="ts-lbl">RBI</div></div>
                <div style={{gridColumn:'1/-1',fontSize:8,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',paddingBottom:2,borderBottom:'1px solid var(--border)',marginBottom:2,marginTop:4}}>Pitching</div>
                <div className="ts"><div className="ts-val">{t.pitching?.era?.toFixed(2)}</div><div className="ts-lbl">ERA</div></div>
                <div className="ts"><div className="ts-val">{t.pitching?.whip?.toFixed(2)}</div><div className="ts-lbl">WHIP</div></div>

      {sel && <TeamSheet team={sel} playerStats={playerStats} onClose={()=>setSel(null)}/>}

  );
}

// ── PLAYERS TAB ──────────────────────────────────────────────────────────────
function PlayersTab({playerStats, games}) {
  const [mode, setMode] = React.useState('hitting');
  const [q, setQ] = React.useState('');
  const [teamF, setTeamF] = React.useState('');
  const [sortCol, setSortCol] = React.useState(mode==='hitting'?'avg':'era');
  const [sortDir, setSortDir] = React.useState('desc');
  const [sel, setSel] = React.useState(null);

  React.useEffect(() => {
    setSortCol(mode==='hitting'?'avg':'era');
    setSortDir(mode==='hitting'?'desc':'asc');
  }, [mode]);

  const rows = (playerStats?.[mode]||[])
    .filter(p => (!q || p.name.toLowerCase().includes(q.toLowerCase())) && (!teamF || p.team===teamF))
    .sort((a,b) => {
      const av = a[sortCol]??0, bv = b[sortCol]??0;
      return sortDir==='asc' ? av-bv : bv-av;
    });

  const hitCols  = [['G','games'],['AB','ab'],['H','h'],['AVG','avg'],['HR','hr'],['RBI','rbi'],['2B','doubles'],['3B','triples'],['BB','bb'],['K','so'],['SB','sb'],['OBP','obp'],['OPS','ops']];
  const pitCols  = [['G','games'],['IP','ip_dec'],['H','h'],['BB','bb'],['K','so'],['ERA','era'],['WHIP','whip'],['K/6','k_per_6'],['B/6','bb_per_6'],['K/BB','k_bb']];
  const cols = mode==='hitting' ? hitCols : pitCols;

  const sort = col => {
    if (sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc');
    else { setSortCol(col); setSortDir(col==='era'||col==='whip'||col==='bb_per_6'?'asc':'desc'); }
  };

  const fmtVal = (row, key) => {
    const v = row[key];
    if (v===undefined||v===null) return '—';
    if (['avg','obp','slg','ops','era','whip','k_bb','strike_pct'].includes(key)) {
      if (key==='avg'||key==='obp'||key==='slg'||key==='ops') return (+v).toFixed(3).replace(/^0\./,'.').replace(/^-0\./,'-.');
      return (+v).toFixed(2);
    }
    if (key==='ip_dec') return row.ip || (+v).toFixed(1);
    if (key==='k_per_6'||key==='bb_per_6') return (+v).toFixed(1);
    return v;
  };

  const hiCols = mode==='hitting' ? ['avg','obp','ops'] : ['era','whip','k_per_6'];

  const teams = [...new Set((playerStats?.hitting||[]).map(p=>p.team))].sort();

  return (
    <div>
      <div className="seg">
        <button className={`seg-btn${mode==='hitting'?' on':''}`} onClick={()=>setMode('hitting')}>⚾ Hitting</button>
        <button className={`seg-btn${mode==='pitching'?' on':''}`} onClick={()=>setMode('pitching')}>🥎 Pitching</button>
      </div>
      <div className="filter-row">
        <input className="srch" placeholder="Search player…" value={q} onChange={e=>setQ(e.target.value)}/>
        <select className="tsel" value={teamF} onChange={e=>setTeamF(e.target.value)}>
          <option value="">All Teams</option>
          {teams.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>
      <div className="tbl-outer">
        <div className="tbl-wrap">
          <table className={`stbl${mode==='pitching'?' green':''}`}>
            <thead>
              <tr>
                <th onClick={()=>sort('name')}>Player <span className="srt-arr">⇅</span></th>
                {cols.map(([lbl,key])=>(
                  <th key={key} className={sortCol===key?'srt':''} onClick={()=>sort(key)}>
                    {lbl}<span className="srt-arr">{sortCol===key?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row,i)=>{
                const tc = teamColor(row.team);
                return (
                  <tr key={i} onClick={()=>setSel({player:row,mode})}>
                    <td><span className="tdot" style={{background:tc.a}}/>{row.name}</td>
                    {cols.map(([,key])=>(
                      <td key={key} className={hiCols.includes(key)?'hi':''}>{fmtVal(row,key)}</td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{height:14}}/>
      {sel && <PlayerSheet player={sel.player} mode={sel.mode} games={games} onClose={()=>setSel(null)}/>}
    </div>
  );
}

            <>
              <div className="pills-row">

                  <div key={l} className="pill hi"><div className="pill-val">{v??'—'}</div><div className="pill-lbl">{l}</div></div>

            : gameLogs.map((g,i)=>{
                const opp = '—'; // schedule doesn't include opponent per player line
                if (mode==='hitting') {
                  const summary = [g.hr?`${g.hr} HR`:'',g.rbi?`${g.rbi} RBI`:'',g.sb?`${g.sb} SB`:'',g.doubles?`${g.doubles} 2B`:'',g.triples?`${g.triples} 3B`:''].filter(Boolean).join(', ');
                  return (
                    <div key={i} className="glog-item">
                      <div className="glog-date">{g.date?fmtDate(g.date):g.iso_date?.slice(5).replace('-','/')}</div>

                  return (

                      <div style={{flex:1,fontSize:10,color:'var(--muted)',textAlign:'right'}}>{g.so}K {g.bb}BB {g.er}ER</div>

      </div>

  );
}

// ── SCHEDULE TAB ─────────────────────────────────────────────────────────────
function ScheduleTab({schedule, results}) {
  const [view, setView] = React.useState('results');

  // Build standings from results
  const TEAMS = ["Astros","Brewers","Giants","Guardians","Marlins","Padres","White Sox","Yankees"];
  const standings = React.useMemo(() => {
    if (!results) return [];
    return TEAMS.map(team => {
      const tg = results.filter(g=>g.t1===team||g.t2===team);
      const w = tg.filter(g=>g.winner===team).length;
      const l = tg.length - w;
      const rs = tg.reduce((acc,g)=>acc+(g.t1===team?g.s1:g.s2),0);
      const ra = tg.reduce((acc,g)=>acc+(g.t1===team?g.s2:g.s1),0);
      return {team,w,l,g:tg.length,pct:tg.length?w/tg.length:0,rs,ra};
    }).sort((a,b)=>b.pct-a.pct||b.w-a.w);
  }, [results]);

  // Group results by date descending
  const byDate = React.useMemo(() => {
    if (!results) return [];
    const map = {};
    results.forEach(g => { if (!map[g.date]) map[g.date]=[];  map[g.date].push(g); });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  }, [results]);

  return (
    <div>
      <div className="seg">
        <button className={`seg-btn${view==='standings'?' on':''}`} onClick={()=>setView('standings')}>🏅 Standings</button>
        <button className={`seg-btn${view==='results'?' on':''}`} onClick={()=>setView('results')}>📋 Results</button>
      </div>

      {view==='standings' && (
        <>
          <div className="sec-hdr">
            <div className="sec-bar" style={{background:'var(--navy)'}}/>
            <div className="sec-ttl">2026 Standings</div>
          </div>
          <div style={{margin:'0 14px'}}>
            <div style={{borderRadius:12,overflow:'hidden',boxShadow:'0 1px 6px rgba(0,0,0,.08)'}}>
              <table className="stbl" style={{minWidth:'unset',width:'100%'}}>
                <thead>
                  <tr>
                    <th style={{textAlign:'left',paddingLeft:12,minWidth:110,position:'sticky',left:0,background:'var(--navy)',zIndex:3}}>Team</th>
                    <th>W</th><th>L</th><th>PCT</th><th>RS</th><th>RA</th><th>DIFF</th>
                  </tr>
                </thead>
                <tbody>
                  {standings.map((s,i)=>{
                    const tc=teamColor(s.team);
                    const diff = s.rs-s.ra;
                    return (
                      <tr key={s.team}>
                        <td style={{position:'sticky',left:0,background:i%2?'#f8fafc':'#fff',zIndex:2}}>
                          <span className="tdot" style={{background:tc.a}}/>
                          {s.team}
                        </td>
                        <td style={{fontWeight:800,color:'#166534'}}>{s.w}</td>
                        <td style={{color:'var(--muted)'}}>{s.l}</td>
                        <td style={{fontWeight:700}}>{s.pct.toFixed(3).replace(/^0/,'')}</td>
                        <td>{s.rs}</td>
                        <td>{s.ra}</td>
                        <td style={{fontWeight:700,color:diff>=0?'#166534':'#dc2626'}}>{diff>0?'+':''}{diff}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{height:14}}/>
        </>
      )}

      {view==='results' && (
        <>
          <div className="sec-hdr">
            <div className="sec-bar" style={{background:'var(--navy)'}}/>
            <div className="sec-ttl">Game Results</div>
            <div style={{marginLeft:'auto',fontSize:10,color:'var(--muted)'}}>{results?.length||0} games</div>
          </div>
          {byDate.map(([date, games])=>(
            <div key={date}>
              <div className="sday-hdr">{fmtDate(date)}</div>
              {games.map((g,k)=>{
                const tc1=teamColor(g.t1), tc2=teamColor(g.t2);
                const w1=g.winner===g.t1, w2=g.winner===g.t2;
                return (
                  <div key={k} className="sgame" style={{gap:0}}>
                    <div style={{flex:1,display:'flex',flexDirection:'column',gap:5}}>
                      {/* Team 1 */}
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span className="tdot" style={{background:tc1.a}}/>
                        <span style={{fontSize:12,fontWeight:w1?800:500,color:w1?'var(--text)':'var(--muted)',flex:1}}>{g.t1}</span>
                        <span style={{fontSize:14,fontWeight:800,color:w1?'var(--text)':'var(--muted)',minWidth:22,textAlign:'right'}}>{g.s1}</span>
                      </div>
                      {/* Team 2 */}
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span className="tdot" style={{background:tc2.a}}/>
                        <span style={{fontSize:12,fontWeight:w2?800:500,color:w2?'var(--text)':'var(--muted)',flex:1}}>{g.t2}</span>
                        <span style={{fontSize:14,fontWeight:800,color:w2?'var(--text)':'var(--muted)',minWidth:22,textAlign:'right'}}>{g.s2}</span>
                      </div>
                    </div>
                    <div style={{marginLeft:12,fontSize:9,color:'var(--muted)',alignSelf:'center',flexShrink:0}}>{g.field}</div>
                  </div>
                );
              })}
            </div>
          ))}
          <div style={{height:14}}/>
        </>
      )}
    </div>
  );
}

// ── ALL STAR TRACKER TAB ─────────────────────────────────────────────────────
function AllStarTab({data}) {
  const [sec, setSec] = React.useState(0);
  const [sortCol, setSortCol] = React.useState('avg');
  const [sortDir, setSortDir] = React.useState('desc');
  if (!data) return <div className="loading">Loading…</div>;

  const section = data[sec];
  const rows = [...(section?.players||[])].sort((a,b)=>{
    const av=a[sortCol]??999, bv=b[sortCol]??999;
    return sortDir==='asc'?av-bv:bv-av;
  });

  const sort = col => {
    if (sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc');
    else { setSortCol(col); setSortDir(col==='era'?'asc':'desc'); }
  };

  const hitCols = [['AVG','avg'],['H','h'],['HR','hr'],['RBI','rbi'],['R','r'],['SB','sb'],['BB','bb']];
  const pitCols = [['IP','ip'],['ERA','era'],['STR%','strike_pct']];
  const allCols = [...hitCols,...pitCols];

  const fmtVal = (row,key) => {
    const v = row[key];
    if (v===null||v===undefined) return '—';
    if (key==='avg') return v.toFixed(3).replace(/^0/,'.');
    if (key==='era') return v.toFixed(2);
    if (key==='strike_pct') return v.toFixed(1)+'%';
    if (key==='ip') return v % 1 ? v.toFixed(1) : v;
    return v;
  };

  const getRkColor = rk => {
    if (!rk) return 'var(--muted)';
    if (rk===1) return '#b45309';
    if (rk<=3) return '#166534';
    if (rk<=10) return '#1d4ed8';
    return 'var(--muted)';
  };

  return (
    <div>
      <div className="seg" style={{margin:'10px 14px'}}>
        {data.map((s,i)=>(
          <button key={i} className={`seg-btn${sec===i?' on':''}`}
            style={{fontSize:10,padding:'6px 4px'}}
            onClick={()=>setSec(i)}>
            {s.title.replace('2025 ','')}
          </button>
        ))}
      </div>
      <div style={{padding:'0 14px 6px',fontSize:11,color:'var(--muted)',lineHeight:1.5}}>
        Rankings compare each player vs. age-group peers. Tap a column header to sort.
      </div>
      <div style={{margin:'0 14px',overflowX:'auto'}}>
        <div style={{borderRadius:12,overflow:'hidden',boxShadow:'0 1px 6px rgba(0,0,0,.08)'}}>
          <table className="stbl" style={{width:'100%'}}>
            <thead>
              <tr>
                <th style={{textAlign:'left',paddingLeft:10,position:'sticky',left:0,background:'var(--navy)',zIndex:3,minWidth:120}}>Player</th>
                {allCols.map(([lbl,key])=>(
                  <th key={key} className={sortCol===key?'srt':''} onClick={()=>sort(key)}>
                    {lbl}<span className="srt-arr">{sortCol===key?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row,i)=>{
                const tc=teamColor(row.team);
                return (
                  <tr key={i}>
                    <td style={{position:'sticky',left:0,background:i%2?'#f8fafc':'#fff',zIndex:2}}>
                      <div style={{fontWeight:700,fontSize:11}}><span className="tdot" style={{background:tc.a}}/>{row.name}</div>
                      <div style={{fontSize:9,color:'var(--muted)'}}>{row.team}</div>
                    </td>
                    {allCols.map(([,key])=>{
                      const rkKey = key+'_rk';
                      const rk = row[rkKey];
                      return (
                        <td key={key} style={{padding:'5px 4px'}}>
                          <div style={{fontWeight:700,fontSize:11,color:sortCol===key?'var(--navy)':'var(--text)'}}>{fmtVal(row,key)}</div>
                          {rk && <div style={{fontSize:8,color:getRkColor(rk),fontWeight:600}}>#{rk}</div>}
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{height:14}}/>
    </div>
  );
}

// ── REPORTS TAB ──────────────────────────────────────────────────────────────
function ReportsTab({report}) {
  return (
    <div>
      <div className="sec-hdr">
        <div className="sec-bar" style={{background:'var(--gold)'}}/>
        <div className="sec-ttl">Pitching Report</div>
        <div style={{marginLeft:'auto',fontSize:10,color:'var(--muted)'}}>2026 Season</div>
      </div>
      <div className="rpt-body">
        {report ? renderMd(report) : <div className="loading">Loading report…</div>}
      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"accentColor":"#002B5C","compactTables":true,"showGameLogs":true}/*EDITMODE-END*/;

function App() {
  const [tab, setTab] = React.useState(()=>localStorage.getItem('ll-tab')||'leaders');
  const [data, setData] = React.useState(null);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [twkOpen, setTwkOpen] = React.useState(false);

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type==='__activate_edit_mode') setTwkOpen(true);
      if (e.data?.type==='__deactivate_edit_mode') setTwkOpen(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'},'*');
  }, []);

  React.useEffect(() => {
    Promise.all([
      fetch('uploads/leaderboards.json').then(r=>r.json()),
      fetch('uploads/player_stats.json').then(r=>r.json()),
      fetch('uploads/team_stats.json').then(r=>r.json()),
      fetch('uploads/schedule.json').then(r=>r.json()),
      fetch('uploads/games.json').then(r=>r.json()),
      fetch('uploads/Pitching_Report_2026.md').then(r=>r.text()),
      fetch('uploads/meta.json').then(r=>r.json()),
      fetch('uploads/results.json').then(r=>r.json()),
      fetch('uploads/standings.json').then(r=>r.json()),
      fetch('uploads/allstar_tracker.json').then(r=>r.json()),
    ]).then(([lb,ps,ts,sched,games,report,meta,results,standings,allstar])=>{
      setData({lb,ps,ts,sched,games,report,meta,results,standings,allstar});
    }).catch(e=>console.error('Data load error',e));
  }, []);

  const changeTab = t => {
    setTab(t);
    localStorage.setItem('ll-tab', t);
  };

  const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  const tabs = [
    {id:'leaders', icon:'🏆',label:'Leaders'},
    {id:'teams',   icon:'🏟️',label:'Teams'},
    {id:'players', icon:'👤',label:'Players'},
    {id:'schedule',icon:'📅',label:'Schedule'},
    {id:'allstar', icon:'⭐',label:'All Stars'},
    {id:'reports', icon:'📝',label:'Reports'},
  ];

  return (
    <>
    <div className="hdr">
      <div className="hdr-row">
        <div>
          <div className="hdr-title">⚾ Alameda LL Majors</div>
          <div className="hdr-sub">2026 · 8 Teams · {data?.meta?.game_files||82} games</div>
        </div>
        <div className="hdr-date">
          <div className="hdr-date-lbl">AS OF</div>
          <div className="hdr-date-val">May 4</div>
        </div>
      </div>
    </div>

    <div className="content">
      {!data
        ? <div className="loading">Loading stats…</div>
        : tab==='leaders'  ? <LeadersTab lb={data.lb}/>
        : tab==='teams'    ? <TeamsTab teamStats={data.ts} playerStats={data.ps} results={data.results} standings={data.standings}/>
        : tab==='players'  ? <PlayersTab playerStats={data.ps} games={data.games}/>
        : tab==='schedule' ? <ScheduleTab schedule={data.sched} results={data.results}/>
        : tab==='allstar'  ? <AllStarTab data={data.allstar}/>
        : tab==='reports'  ? <ReportsTab report={data.report}/>
        : null
      }
    </div>

    <div className="bnav">
      {tabs.map(t=>(
        <button key={t.id} className={`bnav-item${tab===t.id?' on':''}`} onClick={()=>changeTab(t.id)}>
          <span className="bnav-icon">{t.icon}</span>
          <span className="bnav-lbl">{t.label}</span>
        </button>
      ))}
    </div>

    {twkOpen && (
      <div className="twk">
        <div className="twk-title">Tweaks</div>
        <div className="twk-row">
          <div className="twk-lbl">Compact tables</div>
          <input type="checkbox" checked={tweaks.compactTables} onChange={e=>{
            const v={...tweaks,compactTables:e.target.checked};
            setTweaks(v);
            window.parent.postMessage({type:'__edit_mode_set_keys',edits:v},'*');
          }}/>
        </div>
        <div className="twk-row">
          <div className="twk-lbl">Show game logs</div>
          <input type="checkbox" checked={tweaks.showGameLogs} onChange={e=>{
            const v={...tweaks,showGameLogs:e.target.checked};
            setTweaks(v);
            window.parent.postMessage({type:'__edit_mode_set_keys',edits:v},'*');
          }}/>
        </div>
      </div>
    )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
